<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複数社 自動収益システム提案｜はじめ工房</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue:#2563eb; --teal:#0891b2; --green:#059669; --amber:#d97706; --red:#dc2626; --purple:#7c3aed;
      --bg:#f8f9fb; --card:#ffffff; --border:#e0e8f0; --text:#1e293b; --muted:#64748b; --light:#94a3b8;
      --s8:8px; --s13:13px; --s21:21px; --s34:34px; --s55:55px;
    }
    body { font-family:'Noto Sans JP','Yu Gothic',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* Header */
    header { background:var(--card); border-bottom:1px solid var(--border); padding:var(--s13) var(--s34); display:flex; align-items:center; gap:var(--s13); }
    .logo { font-size:18px; font-weight:700; color:var(--blue); }
    .logo span { color:#f59e0b; }
    .tagline { font-size:13px; color:var(--muted); }

    /* Layout */
    .main { max-width:1340px; margin:0 auto; padding:var(--s21); display:grid; grid-template-columns:38% 1fr; gap:var(--s21); align-items:start; }

    /* Input Panel */
    .input-panel { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:var(--s21); position:sticky; top:var(--s21); }
    .panel-title { font-size:15px; font-weight:700; padding-bottom:var(--s13); border-bottom:2px solid #e8f4fd; margin-bottom:var(--s21); }

    /* API box */
    .api-box { background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:var(--s13); margin-bottom:var(--s21); }
    .api-box-title { font-size:12px; font-weight:600; color:#92400e; margin-bottom:6px; }
    .api-note { font-size:11px; color:#a16207; margin-top:5px; }
    .api-set-badge { background:#eef7ee; border:1px solid #bbf7d0; border-radius:8px; padding:10px var(--s13); font-size:13px; color:var(--green); font-weight:500; margin-bottom:var(--s21); display:none; }

    /* URL inputs */
    .url-list { margin-bottom:var(--s13); }
    .url-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
    .url-row .num { width:24px; height:24px; border-radius:50%; background:#e8f4fd; color:var(--blue); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .url-row input { flex:1; padding:9px var(--s13); border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px; color:var(--text); background:#fafafa; transition:border-color .2s; }
    .url-row input:focus { outline:none; border-color:var(--blue); background:#fff; }
    .url-row input.loading { border-color:var(--amber); }
    .url-row input.done    { border-color:var(--green); }
    .url-row input.error   { border-color:var(--red); }
    .del-btn { width:28px; height:28px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--light); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .del-btn:hover { border-color:var(--red); color:var(--red); }
    .add-btn { width:100%; padding:8px; border:1.5px dashed var(--border); border-radius:8px; background:var(--card); font-family:inherit; font-size:13px; color:var(--muted); cursor:pointer; margin-bottom:var(--s21); transition:all .15s; }
    .add-btn:hover { border-color:var(--blue); color:var(--blue); }
    .add-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* Buttons */
    .gen-btn { width:100%; padding:var(--s13); background:linear-gradient(135deg,var(--blue),var(--teal)); color:#fff; border:none; border-radius:10px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .2s,transform .2s; }
    .gen-btn:hover:not(:disabled) { opacity:.88; transform:translateY(-1px); }
    .gen-btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }

    /* Progress */
    .progress-bar { height:4px; background:var(--border); border-radius:2px; margin-top:var(--s13); overflow:hidden; display:none; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--teal)); border-radius:2px; transition:width .3s; }
    .progress-text { font-size:12px; color:var(--muted); margin-top:5px; display:none; text-align:center; }

    /* Output Panel */
    .output-panel { min-height:400px; }
    .empty-state { background:var(--card); border:2px dashed var(--border); border-radius:13px; padding:var(--s55) var(--s34); text-align:center; color:var(--light); }
    .empty-icon { font-size:52px; margin-bottom:var(--s13); }
    .empty-text { font-size:15px; line-height:1.8; }

    /* Export all button */
    .export-all-btn { width:100%; padding:var(--s13); background:linear-gradient(135deg,var(--green),var(--teal)); color:#fff; border:none; border-radius:10px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:var(--s21); transition:opacity .2s,transform .2s; display:none; }
    .export-all-btn:hover { opacity:.88; transform:translateY(-1px); }

    /* Company card */
    .company-card { background:var(--card); border:1px solid var(--border); border-radius:13px; margin-bottom:var(--s21); overflow:hidden; animation:fadeUp .4s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .company-header { padding:var(--s13) var(--s21); background:linear-gradient(135deg,#f8f9fb,#f0f4f8); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--s13); }
    .co-num { width:36px; height:36px; border-radius:50%; background:var(--blue); color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .co-name { font-size:16px; font-weight:700; color:var(--text); }
    .co-url  { font-size:11px; color:var(--light); }
    .co-industry { margin-left:auto; padding:3px 10px; border-radius:20px; background:#e8f4fd; color:var(--blue); font-size:12px; font-weight:600; white-space:nowrap; }

    .company-body { padding:var(--s21); }

    /* Can-do section */
    .cando-section { background:#f0f9ff; border:1px solid #bae6fd; border-radius:10px; padding:var(--s13) var(--s21); margin-bottom:var(--s21); }
    .cando-title { font-size:13px; font-weight:700; color:#0369a1; margin-bottom:10px; }
    .cando-item { display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; font-size:13px; color:var(--text); line-height:1.6; }
    .cando-item:last-child { margin-bottom:0; }
    .cando-dot { width:20px; height:20px; border-radius:50%; background:#0369a1; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }

    /* Section heading inside card */
    .proposals-heading { font-size:12px; font-weight:600; color:var(--light); letter-spacing:.6px; text-transform:uppercase; margin-bottom:var(--s13); padding-bottom:6px; border-bottom:1px solid var(--border); }

    /* Proposal card (inner) */
    .proposal-card { border:1px solid var(--border); border-radius:10px; padding:var(--s13) var(--s21); margin-bottom:var(--s13); }
    .card-head { display:flex; align-items:flex-start; gap:var(--s13); margin-bottom:10px; }
    .card-num { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
    .n1{background:#e8f4fd;color:var(--blue)} .n2{background:#eef7ee;color:var(--green)} .n3{background:#fdf3e7;color:var(--amber)}
    .card-title { font-size:15px; font-weight:700; }
    .card-tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
    .tag { padding:2px 8px; border-radius:4px; font-size:11px; background:#f0f4f8; color:var(--muted); }
    .tag-co{background:#e8f4fd;color:var(--blue)} .tag-sub{background:#eef7ee;color:var(--green)} .tag-con{background:#fdf3e7;color:var(--amber)} .tag-plt{background:#f3e8ff;color:var(--purple)}
    .card-overview { font-size:13px; color:#475569; line-height:1.75; padding:10px var(--s13); background:#f8f9fb; border-radius:6px; margin-bottom:10px; }
    .section-label { font-size:10px; font-weight:600; color:var(--light); letter-spacing:.6px; text-transform:uppercase; margin-bottom:6px; }
    .flow-row { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-bottom:10px; }
    .flow-step { padding:4px 9px; border:1px solid var(--border); border-radius:5px; font-size:11px; color:#475569; background:#fff; }
    .flow-arr { color:var(--border); font-size:14px; }
    .stakeholders { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .stakeholder { flex:1; min-width:80px; padding:8px; border:1px solid var(--border); border-radius:7px; background:#fafafa; text-align:center; }
    .sh-name { font-size:11px; font-weight:600; margin-bottom:2px; }
    .sh-role { font-size:9px; color:var(--light); margin-bottom:3px; }
    .sh-benefit { font-size:10px; color:var(--muted); }
    .numbers-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
    .num-item { padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:#f8f9fb; }
    .num-label { font-size:10px; color:var(--light); margin-bottom:2px; }
    .num-val   { font-size:12px; font-weight:700; }
    .circ-box { font-size:12px; color:var(--muted); background:#f8f9fb; padding:7px 10px; border-radius:6px; margin-bottom:10px; }
    .risks { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
    .risk-tag { padding:2px 7px; border:1px solid #fecaca; border-radius:4px; font-size:10px; background:#fef2f2; color:var(--red); }
    .action-box { padding:8px 12px; background:linear-gradient(135deg,#eef7ee,#e8f4fd); border-radius:6px; }
    .action-label { font-size:10px; font-weight:600; color:var(--green); margin-bottom:2px; }
    .action-text { font-size:12px; }

    /* Collaboration section */
    .collab-section { background:linear-gradient(135deg,#f0fdf4,#ecfdf5); border:1px solid #6ee7b7; border-radius:10px; padding:var(--s13) var(--s21); margin-bottom:var(--s21); }
    .collab-title { font-size:13px; font-weight:700; color:#065f46; margin-bottom:var(--s13); display:flex; align-items:center; gap:6px; }
    .collab-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
    .collab-item { background:#fff; border:1px solid #a7f3d0; border-radius:7px; padding:9px 12px; }
    .collab-label { font-size:10px; font-weight:600; color:#059669; margin-bottom:3px; }
    .collab-val   { font-size:12px; color:var(--text); line-height:1.5; }
    .collab-approach { background:#fff; border:1px solid #a7f3d0; border-radius:7px; padding:10px 13px; }
    .collab-approach-label { font-size:10px; font-weight:600; color:#059669; margin-bottom:4px; }
    .collab-approach-text  { font-size:13px; color:var(--text); font-weight:500; line-height:1.6; }

    /* Company card export btn */
    .co-export-btn { display:block; width:100%; padding:9px; background:var(--card); border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px; color:var(--muted); cursor:pointer; margin-top:var(--s13); transition:all .15s; text-align:center; }
    .co-export-btn:hover { border-color:var(--blue); color:var(--blue); }

    /* Loading card */
    .loading-card { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:var(--s34); margin-bottom:var(--s21); display:flex; align-items:center; gap:var(--s13); }
    .spinner-sm { width:24px; height:24px; border:2.5px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; flex-shrink:0; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* Capability chips */
    .chip { padding:4px 11px; border:1px solid var(--border); border-radius:20px; font-size:11px; cursor:pointer; background:#f0f4f8; color:var(--muted); transition:all .15s; user-select:none; }
    .chip:hover { background:#e8f4fd; border-color:var(--blue); color:var(--blue); }
    .chip.active { background:#e8f4fd; border-color:var(--blue); color:var(--blue); font-weight:600; }

    @media (max-width:900px) { .main{grid-template-columns:1fr} .input-panel{position:static} }
    @media print { .input-panel{display:none} .main{grid-template-columns:1fr} body{background:#fff} }
  </style>
</head>
<body>

<header>
  <div class="logo"><span>は</span>じめ工房</div>
  <span style="color:var(--border);margin:0 4px">|</span>
  <div class="tagline">複数社 自動収益システム提案エンジン（最大9社）</div>
</header>

<div class="main">

  <!-- Input Panel -->
  <div class="input-panel">
    <div class="panel-title">会社URLを入力（最大9社）</div>

    <div class="api-box">
      <div class="api-box-title">🔑 Anthropic APIキー</div>
      <input type="password" id="apiKey" placeholder="sk-ant-...">
      <div class="api-note">ブラウザに保存しません。セッション中のみ使用。</div>
    </div>
    <div class="api-set-badge" id="apiSetBadge"></div>

    <div class="url-list" id="urlList"></div>
    <button class="add-btn" id="addBtn" onclick="addUrlRow()">＋ 会社を追加（残り <span id="remaining">8</span>社）</button>

    <div style="margin-bottom:var(--s21)">
      <label style="display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">
        ＋ あなたのリソース・できること
        <span style="font-size:11px;font-weight:400;color:var(--light)">（全社共通で提案に反映）</span>
      </label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px" id="capChips">
        <div class="chip" data-val="農家・生産者とのネットワーク">農家ネットワーク</div>
        <div class="chip" data-val="企業への法人営業経験">法人営業経験</div>
        <div class="chip" data-val="アンケート設計・効果測定">アンケート設計</div>
        <div class="chip" data-val="美容機器の仕入れルート">美容機器仕入れ</div>
        <div class="chip" data-val="セミナー・研修の企画運営">セミナー企画</div>
        <div class="chip" data-val="IT・Web制作・システム開発">IT・Web開発</div>
      </div>
      <textarea id="capInput" placeholder="例：&#10;・米農家ネットワーク（新潟・秋田）&#10;・中小企業への営業実績&#10;・AI活用ツールの提供" style="width:100%;height:90px;padding:10px 13px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:#fafafa;resize:vertical;line-height:1.6"></textarea>
    </div>

    <button class="gen-btn" id="genBtn">分析スタート</button>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <!-- Output Panel -->
  <div class="output-panel" id="outputPanel">
    <div class="empty-state">
      <div class="empty-icon">🏢</div>
      <div class="empty-text">会社のホームページURLを入力して<br>自動収益システムを提案します</div>
    </div>
  </div>

</div>

<script>
  // ─── Constants ───
  const MAX = 9;
  const PROXY = 'https://api.allorigins.win/get?url=';
  const PAGES_BASE = 'https://ishikawa-droid.github.io/hajime-apps/company-analysis/';

  const TAG_CLASS = {
    '共創型':'tag-co','サブスク型':'tag-sub','消耗品型':'tag-con',
    'カートリッジ型':'tag-con','プラットフォーム型':'tag-plt','ライセンス型':'tag-plt',
  };

  let results = [];

  // ─── URL hash: auto-fill API key ───
  (function initApiKey() {
    const fullHash = location.hash;
    if (!fullHash || !fullHash.includes('key=')) return;
    const afterKey = fullHash.slice(fullHash.indexOf('key=') + 4);
    const rawEncoded = afterKey.split('&')[0];
    let key;
    try { key = decodeURIComponent(rawEncoded).trim(); } catch(e) { key = rawEncoded.trim(); }
    if (!key) return;
    document.getElementById('apiKey').value = key;
    document.querySelector('.api-box').style.display = 'none';
    const badge = document.getElementById('apiSetBadge');
    badge.style.display = 'block';
    badge.textContent = '✅ APIキー設定済み（' + key.slice(0, 14) + '…）';
  })();

  // ─── URL row management ───
  function addUrlRow(val = '') {
    const list = document.getElementById('urlList');
    const count = list.children.length;
    if (count >= MAX) return;

    const idx = count + 1;
    const row = document.createElement('div');
    row.className = 'url-row';
    row.innerHTML = `
      <div class="num">${idx}</div>
      <input type="url" placeholder="https://example.com" value="${val}" />
      <button class="del-btn" onclick="removeUrlRow(this)" title="削除">×</button>`;
    list.appendChild(row);
    updateAddBtn();
    reindexRows();
  }

  function removeUrlRow(btn) {
    btn.closest('.url-row').remove();
    reindexRows();
    updateAddBtn();
  }

  function reindexRows() {
    document.querySelectorAll('.url-row .num').forEach((el, i) => { el.textContent = i + 1; });
  }

  function updateAddBtn() {
    const count = document.getElementById('urlList').children.length;
    const btn = document.getElementById('addBtn');
    btn.disabled = count >= MAX;
    document.getElementById('remaining').textContent = MAX - count;
  }

  // Initial row
  addUrlRow();

  // ─── Capability chips ───
  document.querySelectorAll('#capChips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      const active = [...document.querySelectorAll('#capChips .chip.active')]
        .map(c => '・' + c.dataset.val);
      const manual = document.getElementById('capInput').value
        .split('\n').filter(l => !l.startsWith('・') || active.some(a => l.includes(a.slice(1))));
      document.getElementById('capInput').value = [...active, ...manual.filter(l => !l.startsWith('・'))].join('\n');
    });
  });

  // ─── Main: analyze ───
  document.getElementById('genBtn').addEventListener('click', analyzeAll);

  async function analyzeAll() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return alert('Anthropic APIキーを入力してください');

    const urls = [...document.querySelectorAll('.url-row input')]
      .map(i => i.value.trim()).filter(Boolean);
    if (!urls.length) return alert('URLを1件以上入力してください');

    const capabilities = document.getElementById('capInput').value.trim();

    results = [];
    const out = document.getElementById('outputPanel');
    const btn = document.getElementById('genBtn');
    btn.disabled = true; btn.textContent = '分析中…';

    document.getElementById('progressBar').style.display = 'block';
    document.getElementById('progressText').style.display = 'block';

    // Clear output, create placeholder cards
    out.innerHTML = '';
    document.getElementById('exportAllBtn')?.remove();

    urls.forEach((url, i) => {
      const card = document.createElement('div');
      card.className = 'loading-card';
      card.id = 'card-' + i;
      card.innerHTML = `<div class="spinner-sm"></div><div style="font-size:14px;color:var(--muted)">${escHtml(url)} を分析中…</div>`;
      out.appendChild(card);
    });

    let done = 0;
    const updateProgress = () => {
      done++;
      const pct = Math.round(done / urls.length * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${done} / ${urls.length} 社 分析完了`;
    };

    // Parallel fetch + analyze
    await Promise.allSettled(urls.map(async (url, i) => {
      try {
        const info = await fetchCompanyInfo(url);
        const data = await analyzeCompany(apiKey, url, info, capabilities);
        results[i] = { url, data };
        renderCompanyCard(i, url, data);
      } catch(e) {
        results[i] = { url, error: e.message };
        renderErrorCard(i, url, e.message);
      }
      updateProgress();
    }));

    // Show export all button
    const exportBtn = document.createElement('button');
    exportBtn.id = 'exportAllBtn';
    exportBtn.className = 'export-all-btn';
    exportBtn.style.display = 'block';
    exportBtn.textContent = '📄 ' + urls.length + '社まとめ資料を出力';
    exportBtn.onclick = exportAllDocument;
    out.insertBefore(exportBtn, out.firstChild);

    btn.disabled = false; btn.textContent = '分析スタート';
  }

  // ─── Fetch company info via CORS proxy ───
  async function fetchCompanyInfo(url) {
    try {
      const res = await fetch(PROXY + encodeURIComponent(url), { signal: AbortSignal.timeout(10000) });
      if (!res.ok) return null;
      const json = await res.json();
      return extractText(json.contents || '', url);
    } catch {
      return null;
    }
  }

  function extractText(html, url) {
    try {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script,style,nav,footer,noscript').forEach(e => e.remove());
      const title   = doc.title || '';
      const metaDesc = doc.querySelector('meta[name="description"]')?.content
                    || doc.querySelector('meta[property="og:description"]')?.content || '';
      const body = doc.body?.innerText || doc.body?.textContent || '';
      return [title, metaDesc, body].join('\n').replace(/\s+/g, ' ').trim().slice(0, 4000);
    } catch { return ''; }
  }

  // ─── Analyze with Claude ───
  async function analyzeCompany(apiKey, url, pageText, capabilities) {
    const SYSTEM = `あなたはビジネスアナリスト兼自動収益システム専門家です。

【Co-Creation Sales Model（はじめ工房）の理解】

    }
  ]
}

必須：提案1はCo-Creation Sales Model応用版、提案2・3は業界特化。数字は具体的に。collaborationは提案者のリソースを踏まえた実践的な協業シナリオにする。`;

    const USER = `会社URL: ${url}
ホームページ内容:
${pageText || '（取得できませんでした。URLとドメイン名から推測してください）'}

【提案者（システム使用者）のリソース・できること】
${capabilities || '（未入力）'}

上記のリソースをこの会社と掛け合わせる前提で、Co-Creation Sales Model活用方法と3つの自動収益システムを提案してください。`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:3500,
        system:SYSTEM, messages:[{role:'user',content:USER}]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }
    const data  = await res.json();
    const text  = data.content[0].text;
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('JSONの解析に失敗しました');
    return JSON.parse(match[0]);
