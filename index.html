<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめ工房 Apps</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f8f9fb; color: #1e293b; min-height: 100vh; }
    header {
      background: #fff; border-bottom: 1px solid #e0e8f0;
      padding: 16px 40px; display: flex; align-items: center; gap: 12px;
    }
    .logo { font-size: 20px; font-weight: 700; color: #2563eb; }
    .logo span { color: #f59e0b; }
    .sub { font-size: 13px; color: #94a3b8; }
    .main { max-width: 800px; margin: 40px auto; padding: 0 24px; }
    h2 { font-size: 14px; font-weight: 600; color: #94a3b8; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 20px; }
    .app-card {
      background: #fff; border: 1px solid #e0e8f0; border-radius: 12px;
      padding: 24px 28px; margin-bottom: 16px;
      display: flex; align-items: center; gap: 20px;
      text-decoration: none; color: inherit;
      transition: box-shadow .15s, transform .15s;
    }
    .app-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); transform: translateY(-2px); }
    .app-icon { font-size: 36px; flex-shrink: 0; }
    .app-title { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .app-desc  { font-size: 13px; color: #64748b; line-height: 1.6; }
    .app-tag {
      margin-top: 8px; display: inline-block;
      padding: 2px 10px; border-radius: 20px;
      background: #e8f4fd; color: #2563eb; font-size: 11px; font-weight: 600;
    }
    .arrow { margin-left: auto; color: #cbd5e1; font-size: 20px; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span>は</span>じめ工房</div>
    <div class="sub">Apps</div>
  </header>
  <div class="main">
    <h2>ツール一覧</h2>
    <a class="app-card" href="./revenue-model/">
      <div class="app-icon">💡</div>
      <div>
        <div class="app-title">自動収益システム提案エンジン</div>
        <div class="app-desc">業種・リソースを入力すると、Co-Creation Sales Modelを含む3つの自動収益システムを提案。A4資料出力対応。</div>
        <span class="app-tag">Co-Creation Sales Model</span>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
</body>
</html>
